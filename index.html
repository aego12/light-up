<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2b2019">
  <meta name="description" content="light-up · Warm Living — 빛과 온도로 완성하는 스마트홈 앱 프로토타입">
  <link rel="icon" href="/public/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/public/assets/fonts.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="preload" as="image" href="/public/assets/lamp-2700.svg">
  <link rel="preload" as="image" href="/public/assets/lamp-4000.svg">
  <link rel="preload" as="image" href="/public/assets/lamp-6500.svg">
  <title>light-up · Warm Living</title>
</head>
<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="studio-header">
    <a class="wordmark" href="#/welcome" aria-label="light-up 시작 화면">light-up<span>®</span></a>
    <span class="edition">WARM LIVING <i></i> SMART HOME EXPERIENCE</span>
  </header>
  <main class="studio">
    <section class="introduction" aria-labelledby="studio-title">
      <p class="eyebrow"><span class="live-dot"></span> INTERACTIVE APP EXPERIENCE</p>
      <h1 id="studio-title">일상의 온도를,<br>당신의 <em>취향으로.</em></h1>
      <p class="intro-copy">하나의 빛이 공간을 바꾸고,<br>작은 온도가 하루를 편안하게 만듭니다.<br>당신의 집에 맞는 일상을 만나보세요.</p>
    </section>
    <section class="mockup-stage" aria-label="스마트폰 앱 목업">
      <div class="stage-halo" aria-hidden="true"></div>
      <div class="device-wrap"><div class="device">
        <span class="hardware-button hardware-button-left" aria-hidden="true"></span>
        <span class="hardware-button hardware-button-right" aria-hidden="true"></span>
        <div id="app-screen" class="app-screen" aria-label="light-up 앱"></div>
        <div id="toast" role="status" aria-live="polite" class="toast"></div>
      </div></div>
      <p class="touch-hint"><span aria-hidden="true">◌</span> 화면을 눌러 직접 체험해 보세요</p>
    </section>
    <aside class="experience-panel" aria-label="현재 화면과 전체 화면">
      <p class="eyebrow">NOW EXPLORING</p>
      <div class="screen-counter"><span id="screen-number">01</span><span>/ 31</span></div>
      <h2 id="screen-label">웰컴</h2>
      <p id="screen-description">집이 나를 반기는 순간</p>
      <span class="panel-divider"></span>
      <label for="screen-picker">다른 화면 둘러보기</label>
      <select id="screen-picker" aria-label="전체 앱 화면 선택"></select>
      <button id="reset-demo" class="reset-demo">처음 상태로 되돌리기 <span>↺</span></button>
    </aside>
  </main>
  <footer class="studio-footer"><span>LIGHT-UP © 2026</span><span>LIGHT · COMFORT · CONNECTION</span><span class="footer-detail">WARM LIVING — APP PROTOTYPE</span></footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
